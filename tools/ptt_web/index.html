<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#151914">
<title>SpacemiT · 语音对话</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body data-state="start">
<!-- 图标取自 Lucide（ISC 许可，和机器人控制台同一套） -->
<svg class="sprite" aria-hidden="true">
  <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></symbol>
  <symbol id="i-messages" viewBox="0 0 24 24"><path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"/><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  <symbol id="i-hand" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></symbol>
</svg>
<header class="topbar">
  <span class="brand"><img src="logo.svg" alt="SpacemiT 进迭时空"></span>
  <span id="product" class="product-name">语音对话</span>
  <nav id="mode-switch" class="mode-switch" aria-label="模式" hidden>
    <a id="to-control" href="#"><svg><use href="#i-sliders"/></svg><span>控制<span class="long">模式</span></span></a>
    <a class="active" aria-current="page"><svg><use href="#i-mic"/></svg><span>语音<span class="long">模式</span></span></a>
  </nav>
  <span id="connection" class="connection">连接中</span>
</header>
<main>
  <section class="chat" aria-label="对话">
    <div class="chat-head"><h2><svg><use href="#i-messages"/></svg><span id="robot-name">机器人</span></h2><span id="chat-note"></span></div>
    <div id="chat" class="chat-scroll"></div>
  </section>
  <section id="skills" class="skills" hidden>
    <div id="actions" class="chips"></div>
    <button id="all" class="chip more"><svg><use href="#i-grid"/></svg><span id="all-label">全部</span></button>
  </section>
  <section class="dock">
    <p id="status" class="talk-status" role="status"></p>
    <button id="enable" class="primary enable"><svg><use href="#i-mic"/></svg>开启麦克风</button>
    <div class="talk-wrap"><button id="talk" class="talk"><svg><use href="#i-mic"/></svg><strong id="talk-label">按住说话</strong></button></div>
    <p class="dock-tip"><svg><use href="#i-shield"/></svg>说“停下”可让它停止 · 做动作时请保持距离</p>
  </section>
</main>
<div id="sheet-backdrop" class="sheet-backdrop"></div>
<section id="sheet" class="sheet" aria-label="我会这些动作">
  <div class="sheet-head"><h2><svg><use href="#i-hand"/></svg>我会这些动作</h2>
    <button id="close-sheet" class="icon" aria-label="关闭"><svg><use href="#i-x"/></svg></button></div>
  <p class="sheet-note">直接说出来就行，比如“挥个手”“比个心”</p>
  <div id="sheet-actions" class="chips wrap"></div>
  <p class="sheet-note">也可以随便聊</p>
  <div id="sheet-examples" class="chips wrap examples"></div>
</section>
<script src="app.js"></script>
</body>
</html>
