module: application/native/omni_agent

tests:
  - name: omni-agent-wake-config-contract
    description: Verifies configurable wake phrases, ASR prefix stripping, and legacy config compatibility.
    category: functional
    scopes: [pr]
    timeout_s: 120
    workdir: sdk
    command: |
      bash application/native/omni_agent/tests/test_wake_config_contract.sh

  - name: omni-agent-echo-null
    description: Verifies the KWS loudspeaker null attenuates playback, keeps the talker, and relearns after the speaker moves.
    category: functional
    scopes: [pr]
    timeout_s: 120
    workdir: sdk
    command: |
      bash application/native/omni_agent/tests/test_echo_null.sh

  - name: omni-agent-tool-speech
    description: Verifies listed MCP tools wait until the pre-tool line has played, with fallback line, barge-in skip, and parsing of mcp.json pre_tool_speech and llm.json extra_body.
    category: functional
    scopes: [pr]
    timeout_s: 120
    workdir: sdk
    command: |
      bash application/native/omni_agent/tests/test_tool_speech.sh

  - name: omni-agent-ptt-web
    description: Verifies the push-to-talk web server against a fake ptt_chat - shared history, streamed reply text, pending then performed actions, kept text on interrupt, idle-reset marker, press locking, api/info and the HTTP redirect keeping back=.
    category: functional
    scopes: [pr]
    timeout_s: 60
    workdir: sdk
    command: |
      python3 application/native/omni_agent/tests/test_ptt_web.py
